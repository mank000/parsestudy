<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аналитика каталога SATAuto</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="frame top-inner">
      <a class="brand" href="/">SATAuto <span>·</span> Каталог</a>
      <nav aria-label="Разделы">
        <a href="/">Автомобили</a><a href="#overview">Охват</a><a href="#prices">Цены</a><a href="#runs">Прогоны</a>
      </nav>
    </div>
  </header>
  <main class="frame">
    <section id="overview">{overview}</section>
    <section id="prices" class="panel section"><h2>Цены и предложения</h2>{prices}</section>
    <section id="runs" class="panel section"><h2>История прогонов</h2>{history}</section>
  </main>
</body>
</html>
