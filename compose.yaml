name: satauto-catalog-study
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U catalog -d catalog]
      interval: 2s
      timeout: 3s
      retries: 20
  dashboard:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://catalog:catalog-local@postgres:5432/catalog
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./catalog:/app/catalog:ro
      - ./reports:/app/reports:ro
    restart: unless-stopped
volumes:
  catalog-db:
