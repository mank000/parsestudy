name: satauto-catalog-study
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog-local
    ports:
      - "127.0.0.1:${CATALOG_DB_PORT:-55432}:5432"
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, catalog, -d, catalog]
      interval: 2s
      timeout: 3s
      retries: 20
  dashboard:
    image: ${COMPOSE_PROJECT_NAME}-dashboard
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: &catalog-database
      DATABASE_URL: postgresql://catalog:catalog-local@postgres:5432/catalog
    ports:
      - "127.0.0.1:${CATALOG_WEB_PORT:-8765}:8765"
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2m
    restart: unless-stopped
  api:
    profiles: [api]
    image: ${COMPOSE_PROJECT_NAME}-dashboard
    pull_policy: never
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      <<: *catalog-database
    env_file:
      - path: .api.env
        required: false
    ports:
      - "127.0.0.1:${CATALOG_API_PORT:-8766}:8766"
    command: ["uvicorn", "catalog.api:app", "--host", "0.0.0.0", "--port", "8766"]
    healthcheck:
      test: [CMD, python, -c, "from socket import create_connection; create_connection(('127.0.0.1', 8766), timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  parser:
    profiles: [full-scan]
    image: ${COMPOSE_PROJECT_NAME}-dashboard
    pull_policy: never
    init: true
    restart: on-failure
    stop_grace_period: 35s
    depends_on:
      dashboard:
        condition: service_healthy
    env_file:
      - path: .telegram.env
        required: false
    environment:
      <<: *catalog-database
      SATAUTO_COUNTRY: ${SATAUTO_COUNTRY:-}
      SATAUTO_YEAR: ${SATAUTO_YEAR:-}
      SATAUTO_YEAR_MIN: ${SATAUTO_YEAR_MIN:-}
      SATAUTO_YEAR_MAX: ${SATAUTO_YEAR_MAX:-}
      SATAUTO_WORKERS: ${SATAUTO_WORKERS:-6}
    command: ["python", "-u", "-m", "catalog.sync"]
volumes:
  catalog-db:
