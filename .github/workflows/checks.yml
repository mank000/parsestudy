name: Проверки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Тесты PostgreSQL и запуск Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Установить зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Запустить автоматические тесты
        run: make test PYTHON=python
      - name: Проверить запуск и содержимое Docker-каталога
        run: |
          ./parse demo
          curl -fsS 'http://127.0.0.1:8775/?country=JP&availability=active' > catalog.html
          grep -q 'Toyota Corolla' catalog.html
          if grep -q 'Toyota RAV4' catalog.html; then
            exit 1
          fi
          curl -fsS http://127.0.0.1:8775/analytics > analytics.html
          grep -q 'Предложения по странам' analytics.html
      - name: Проверить Swagger в Docker
        env:
          CATALOG_WEB_PORT: 8775
          CATALOG_DB_PORT: 55433
        run: |
          docker compose -p satauto-catalog-demo --profile api up -d --wait api
          curl -fsS http://127.0.0.1:8766/docs > swagger.html
          curl -fsS http://127.0.0.1:8766/openapi.json > openapi.json
          python -c 'import json; assert "/cars" in json.load(open("openapi.json"))["paths"]'
      - name: Вывести логи при сбое
        if: failure()
        run: docker compose -p satauto-catalog-demo --profile api logs --tail=100
